[project]
name = "clm-text2sql"
version = "0.1.0"
description = "Contract Lifecycle Management text-to-SQL agent on BigQuery"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "google-genai>=0.7.0",
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "db-dtypes>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
ui = [
    "streamlit>=1.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "data_gen", "eval"]
